[project]
name = "wassup"
version = "0.1.0"
description = "Wassup news intelligence pipeline and API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "langdetect>=1.0.9",
    "pmtiles>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wassup = "wassup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wassup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
