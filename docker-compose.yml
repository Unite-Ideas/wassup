# Wassup: `docker compose up -d --build`, then open http://localhost:8000
#
# Ollama runs on the host (it gets the GPU directly). The app reaches it through
# host.docker.internal. Settings come from .env (copy .env.example).

services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: wassup
      POSTGRES_PASSWORD: wassup
      POSTGRES_DB: wassup
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wassup-db:/var/lib/postgresql/data
    shm_size: 2g
    stop_grace_period: 2m   # let the database finish writing to disk when stopping
    command: >
      postgres -c shared_buffers=8GB -c effective_cache_size=32GB -c work_mem=128MB
               -c maintenance_work_mem=2GB -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wassup -d wassup"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    init: true              # pass the stop signal on so the app exits in seconds
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wassup:wassup@db:5432/wassup
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_BACKEND: ${EMBED_BACKEND:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      TRIAGE_BACKEND: ${TRIAGE_BACKEND:-hybrid}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-qwen3:8b}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_DAILY_BUDGET_USD: ${JEV_DAILY_BUDGET_USD:-0.50}
      TRANSLATE_BACKEND: ${TRANSLATE_BACKEND:-ollama}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      CONGRESS_API_KEY: ${CONGRESS_API_KEY:-}
      GDELT_BACKFILL_FILES: ${GDELT_BACKFILL_FILES:-16}
      READ_SCOPE: ${READ_SCOPE:-tracked}        # whose full text to read: tracked, all, or off
      READ_CONCURRENCY: ${READ_CONCURRENCY:-32}  # pages downloading at once
      READ_WORKERS: ${READ_WORKERS:-16}          # CPU cores for pulling text out of pages
      TRANSLATE_PARALLEL: ${TRANSLATE_PARALLEL:-3}
      NEWSROOM_WORKERS: ${NEWSROOM_WORKERS:-4}   # desk runs at once; Ollama needs OLLAMA_NUM_PARALLEL of 4 or more
      WASSUP_CONFIG_DIR: /app/config
      # Newsroom (Phase 1). Only used once you run `wassup newsroom connect`.
      PAPERCLIP_URL: http://paperclip:3100
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}
      WASSUP_AGENT_URL: http://app:8000/api/newsroom/heartbeat
      WASSUP_INTERNAL_URL: http://app:8000
      WASSUP_PUBLIC_URL: ${WASSUP_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config:/app/config   # edit desks, interests and sources without rebuilding
      - ./data/maps:/app/data/maps   # map files from scripts/download_maps.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # The newsroom's org chart, schedules and Editor in Chief. Optional: start it with
  #   docker compose --profile newsroom up -d --build
  # The first build takes a while (it builds Paperclip from source). See docs/NEWSROOM.md.
  paperclip:
    profiles: ["newsroom"]
    build:
      context: https://github.com/paperclipai/paperclip.git#v2026.1001.0
    pids_limit: 2048
    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}
      PAPERCLIP_ALLOWED_HOSTNAMES: paperclip   # so the Wassup container can reach it by name
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # Desk agents are Wassup endpoints on the private Docker network; allow exactly that one.
      PAPERCLIP_HTTP_ADAPTER_PRIVATE_ENDPOINT_ALLOWLIST: http://app:8000
      # The Editor in Chief runs Claude Code. Set one of these in .env.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - paperclip-data:/paperclip
    restart: unless-stopped

volumes:
  wassup-db:
  paperclip-data:
