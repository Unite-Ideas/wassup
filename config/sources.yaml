gdelt:
  enabled: true
  translingual: true     # also pull GDELT's machine translated feed covering 65 languages
  # GDELT emits about a thousand articles per 15 minutes per feed. These keep only articles
  # GDELT tagged with at least one of these theme prefixes, so we do not ingest the whole web.
  theme_prefixes:
    - ARMEDCONFLICT
    - MILITARY
    - KILL
    - TERROR
    - WMD
    - CEASEFIRE
    - PEACEKEEPING
    - NEGOTIATIONS
    - SANCTIONS
    - REBELLION
    - COUP
    - PROTEST
    - REFUGEES
    - IMMIGRATION
    - DISPLACED
    - BORDER
    - LEGISLATION
    - ELECTION
    - USPEC_POLITICS
    - TAX_FNCACT_PRESIDENT
    - SURVEILLANCE
    - CYBER_ATTACK
    - CORRUPTION
    - LEAK
    # Broad themes such as LEADER, SECURITY_SERVICES, MANMADE_DISASTER, and CRISISLEX_* are on
    # a large share of all articles, so they are left out on purpose.
  min_themes_matched: 1

congress:
  enabled: true
  # Get a free key at https://api.congress.gov/sign-up/ and set CONGRESS_API_KEY.
  # Without a key Wassup falls back to the shared DEMO_KEY, which is often rate limited,
  # plus the Senate roll call vote list, which needs no key.
  api_key_env: CONGRESS_API_KEY

federal_register:
  enabled: true
