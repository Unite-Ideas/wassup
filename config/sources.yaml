# RSS and Atom sources.
# trust_tier: A primary documents and wires, B established independent, C partisan or low reliability, S state media.
# state_media: true is always shown with a flag in the UI. Independent sources outweigh it.
# Add as many as you like. The collector picks up changes on restart.
# A few outlets (Times of Israel, Tehran Times, Anadolu, AllAfrica) block some networks or
# user agents. Failures are recorded per source and shown at /api/sources; they do not stop the pipeline.

