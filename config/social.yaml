      - {handle: wargonzo, kind: milblogger, lean: Russia}
      - {handle: intelslava, kind: milblogger, lean: Russia}
      - {handle: Slavyangrad, kind: milblogger, lean: Russia}
      - {handle: militarysummary, kind: osint}
      - {handle: mod_russia_en, kind: state, lean: Russia}
      - {handle: mod_russia, kind: state, lean: Russia}
      - {handle: rian_ru, kind: state, lean: Russia}
