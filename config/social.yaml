# Social channels Wassup follows. Seeds are a starting point: the scout scores every channel
# on how early and how reliably it breaks news, discovers new channels that followed ones keep
# forwarding or linking to, and promotes or drops channels by itself. Change a channel by hand
# in the SOURCES tab (pin to keep it, ban to never see it again).
#
# kind:  news | osint | official (government or military) | milblogger | state (state media)
# lean:  which side a channel speaks for, shown next to its posts. Not a judgement of accuracy:
#        the scores are.

telegram:
  check_minutes: 15          # how often a followed channel is checked
  candidate_check_minutes: 120
  max_following: 300
  max_candidates: 150
  seeds:
