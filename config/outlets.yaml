# Trust tiers for outlets by web domain. Used for GDELT, which covers tens of thousands of outlets.
# A: wires and primary sources, B: established independent, C: partisan or low reliability,
# S: state media (always flagged). Anything not listed is U (unknown) and ranks below B.
# Subdomains match their parent (edition.cnn.com matches cnn.com).

suffix_tiers:
  .gov: A
  .mil: A
  .gov.uk: A
  .gc.ca: A
  .europa.eu: A
  un.org: A

domains:
  A: [reuters.com, apnews.com, afp.com, ap.org, bloomberg.com, un.org, who.int, unhcr.org, iom.int, nato.int, iaea.org, icc-cpi.int, reliefweb.int]
